<div class="modal-backdrop" (click)="cancel()"></div>

<div class="modal-shell-wrap" (click)="$event.stopPropagation()">
  <section class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="modal-head">
      <div>
        <span class="modal-eyebrow">Alta administrativa - Nuevo usuario</span>
        <!-- <h2 id="dlg-title">Nuevo usuario</h2> -->
        <p>
          *Los datos son obligatorios.
        </p>
      </div>

      <button type="button" class="icon-btn" (click)="cancel()" aria-label="Cerrar">
        ×
      </button>
    </div>

    <div class="modal-status-row">
      <span class="chip chip-soft">Creación de cuenta</span>
      <span class="chip">Rol configurable</span>
    </div>

    <section class="info-card">
      <h3>Datos del nuevo usuario</h3>

      <form [formGroup]="form" class="form-grid" (ngSubmit)="submit()">
        <label class="field">
          <span class="field__label">Nombres *</span>
          <input type="text" formControlName="nombres" #firstInput />
          <small class="err" *ngIf="f['nombres'].touched && f['nombres'].invalid">
            Campo requerido
          </small>
        </label>

        <label class="field">
          <span class="field__label">Apellidos *</span>
          <input type="text" formControlName="apellidos" />
          <small class="err" *ngIf="f['apellidos'].touched && f['apellidos'].invalid">
            Campo requerido
          </small>
        </label>

        <label class="field">
          <span class="field__label">Usuario *</span>
          <input type="text" formControlName="usuario" />
          <small class="err" *ngIf="f['usuario'].touched && f['usuario'].invalid">
            Usuario debe tener de 6 a 40 caracteres
          </small>
          <small class="err" *ngIf="f['usuario'].errors?.duplicate">
            El nombre de usuario ya está registrado
          </small>
        </label>

        <label class="field">
          <span class="field__label">Email *</span>
          <input type="email" formControlName="email" />
          <small class="err" *ngIf="f['email'].touched && f['email'].invalid">
            Email inválido
          </small>
          <small class="err" *ngIf="f['email'].errors?.duplicate">
            El email ya está registrado
          </small>
        </label>

        <label class="field field--full">
          <span class="field__label">DNI/CUIT/CUIL</span>
          <input type="text" formControlName="dniCuitCuil" />
          <small class="err" *ngIf="f['dniCuitCuil'].errors?.duplicate">
            El documento ya está registrado
          </small>
        </label>

        <label class="field">
          <span class="field__label">Rol *</span>
          <select formControlName="idRolUsuario">
            <option [ngValue]="1">ADMINISTRADOR</option>
            <option [ngValue]="2">OPERARIO</option>
            <option [ngValue]="3">CLIENTE</option>
          </select>
        </label>

        <div class="form-note field--full">
          Al crear el usuario se enviará correo de verificación y solicitud de contraseña.
        </div>

        <div class="modal-actions field--full">
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            {{ loading ? 'Creando…' : 'Crear usuario' }}
          </button>
        </div>
      </form>
    </section>
  </section>
</div>
