<!--La vista es solo decorativa, no posee logica-->
<section class="dsf-wrap">
  <header class="dsf-header">
    <h1 class="dsf-title">Desafíos (Administrador)</h1>
    <p class="dsf-sub">ACA VAN LOS DESAFÍOS PARA EL ADMINISTRADOR</p>
  </header>

  <div class="dsf-grid">
    <article class="dsf-card">
      <div class="dsf-card__media">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M5 3h14a2 2 0 0 1 2 2v2H3V5a2 2 0 0 1 2-2zm16 6v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9h18z"/>
        </svg>
      </div>
      <div class="dsf-card__body">
        <h2 class="dsf-card__title">Crear desafío</h2>
        <p class="dsf-card__desc">Alta de un nuevo desafío con fecha y puntaje.</p>
        <div class="dsf-card__actions">
          <button type="button" class="dsf-btn">VER MÁS →</button>
        </div>
      </div>
    </article>

    <article class="dsf-card">
      <div class="dsf-card__media">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"/>
        </svg>
      </div>
      <div class="dsf-card__body">
        <h2 class="dsf-card__title">Gestionar inscriptos</h2>
        <p class="dsf-card__desc">Revisá participantes y su progreso.</p>
        <div class="dsf-card__actions">
          <button type="button" class="dsf-btn">VER MÁS →</button>
        </div>
      </div>
    </article>

    <article class="dsf-card">
      <div class="dsf-card__media">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M8 5v14l11-7L8 5z"/>
        </svg>
      </div>
      <div class="dsf-card__body">
        <h2 class="dsf-card__title">Reportes</h2>
        <p class="dsf-card__desc">Indicadores y rendimiento de desafíos.</p>
        <div class="dsf-card__actions">
          <button type="button" class="dsf-btn">VER MÁS →</button>
        </div>
      </div>
    </article>
  </div>
</section>
